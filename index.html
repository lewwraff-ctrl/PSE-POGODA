<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceny RB + Pogoda (Sieć Cieplna)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            cursor: default; 
        }
        header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 16px 24px; border-radius: 12px; margin-bottom: 24px;
        }
        h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
        .clock-box { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 700; color: var(--accent-blue); line-height: 1; }
        .date-box { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: 1.4fr 1fr; 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        @media (max-width: 1200px) {
            .grid { grid-template-columns: 1fr; }
        }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
            transition: border-color 0.3s, background-color 0.3s;
            min-width: 0; 
        }

        /* Agresywne, bardzo wyraźne mignięcie kafelka przy zmianie ceny (jaskrawy pomarańcz/złoto) */
        @keyframes flash-tile-heavy {
            0% { background-color: var(--card-bg); border-color: var(--border-color); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
            20% { background-color: rgba(245, 158, 11, 0.6); border-color: #f59e0b; box-shadow: 0 0 60px rgba(245, 158, 11, 1); }
            40% { background-color: var(--card-bg); border-color: var(--border-color); box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
            70% { background-color: rgba(245, 158, 11, 0.5); border-color: #f59e0b; box-shadow: 0 0 50px rgba(245, 158, 11, 0.9); }
            100% { background-color: var(--card-bg); border-color: var(--border-color); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
        }
        .card.flash-animation {
            animation: flash-tile-heavy 1.2s ease-in-out 1 !important;
        }

        .card h2 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
        .card .status-bar { margin-top: auto; }

        .value-huge { font-family: 'JetBrains Mono', monospace; font-size: 4rem; font-weight: 800; margin: 10px 0; letter-spacing: -1px; white-space: nowrap; transition: color 0.3s; }
        .sub-info { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }
        .period {
            display: inline-block; margin-top: 4px; padding: 6px 12px; border-radius: 6px;
            background: rgba(255,255,255,0.05); color: var(--text-main);
            font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.05rem;
        }

        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .weather-item { background: rgba(255,255,255,0.03); padding: 8px 10px; border-radius: 8px; }
        .weather-item span { display: block; font-size: 0.72rem; color: var(--text-muted); }
        .weather-item strong { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }

        .wx-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .wx-top .value-huge { font-size: 2rem; margin: 0; }

        .hourly-title { font-size: 0.72rem; color: var(--text-muted); margin: 10px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .hourly { 
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; 
            scrollbar-width: thin; scrollbar-color: var(--accent-blue) rgba(255,255,255,0.05); 
            -webkit-overflow-scrolling: touch;
        }
        .hourly::-webkit-scrollbar { height: 6px; }
        .hourly::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); border-radius: 4px; }
        .hourly::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
        .hourly::-webkit-scrollbar-thumb:hover { background: #60a5fa; }

        .hour-cell {
            flex: 0 0 54px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px; padding: 6px 3px; text-align: center; font-size: 0.7rem;
        }
        .hour-cell.now { border-color: var(--accent-orange); background: rgba(245,158,11,0.05); }
        .hour-cell .h { color: var(--text-muted); font-weight: 600; font-size: 0.65rem; }
        .hour-cell .ic { font-size: 1.1rem; margin: 3px 0; }
        .hour-cell .t { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 0.85rem; }
        .hour-cell .p { margin-top: 3px; min-height: 1.1em; color: #60a5fa; font-size: 0.65rem; }
        .hour-cell .p.snow { color: #e0f2fe; }
        .hour-cell .w { margin-top: 2px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 0.65rem; }
        .hour-cell .w.mid { color: var(--accent-orange); }
        .hour-cell .w.high { color: var(--accent-red); font-weight: 700; }

        .rb-chart-box { height: 260px; margin-top: 15px; position: relative; width: 100%; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px; }

        .charts-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-container { position: relative; height: 320px; width: 100%; }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
            font-size: 0.78rem; color: var(--text-muted);
            border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 10px;
        }
        .pulse { display: inline-block; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; margin-right: 6px; }
        .pulse.err { background: var(--accent-red); animation: none; }
        .pulse.warn { background: var(--accent-orange); animation: none; }
        .err-text { color: var(--accent-red); }
        .warn-text { color: var(--accent-orange); }
        
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        
        button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        button.muted { background: #ef4444; }
        button.muted:hover { background: #dc2626; }

        .threshold-info { 
            font-size: 0.65rem; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; 
            background: rgba(255,255,255,0.02); padding: 8px 10px; border-radius: 6px; font-weight: 700; text-align: center;
        }
        .threshold-info span { padding: 2px 4px; background: rgba(255,255,255,0.03); border-radius: 4px; }

        #wx-alerts { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .wx-alert { padding: 8px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; border: 1px solid transparent; }
        .wx-alert.cold { background: rgba(147,51,234,0.15); border-color: #9333ea; color: #d8b4fe; }
        .wx-alert.frost { background: rgba(59,130,246,0.15); border-color: #3b82f6; color: #93c5fd; }
        .wx-alert.wind { background: rgba(245,158,11,0.15); border-color: #f59e0b; color: #fcd34d; }
        .wx-alert.rain-warn { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; color: #93c5fd; }

        /* Dyskretny pasek pogodowy widoczny TYLKO w trybie pełnoekranowym */
        #fs-weather-strip { display: none; }

        #cen-card:fullscreen, #cen-card:-webkit-full-screen { 
            background: var(--card-bg); padding: 30px; display: flex; flex-direction: column; 
            justify-content: flex-start; width: 100vw; height: 100vh; overflow: hidden;
        }
        #cen-card:fullscreen h2, #cen-card:-webkit-full-screen h2 { font-size: 2rem !important; margin-bottom: 1vh; }
        #cen-card:fullscreen #cen-period, #cen-card:-webkit-full-screen #cen-period { font-size: 2.5vh !important; padding: 0.6vh 1.2vh; margin: 0 auto; display: block; width: max-content; }
        #cen-card:fullscreen .value-huge, #cen-card:-webkit-full-screen .value-huge { font-size: 13vh !important; text-align: center; margin: 1vh 0; line-height: 1; }
        #cen-card:fullscreen .sub-info, #cen-card:-webkit-full-screen .sub-info { text-align: center; font-size: 2vh; }
        
        /* Styl małego, dyskretnego paska pogodowego w pełnym ekranie */
        #cen-card:fullscreen #fs-weather-strip, #cen-card:-webkit-full-screen #fs-weather-strip {
            display: flex !important;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 0.8vh 1.5vw;
            margin: 1vh auto;
            width: max-content;
            font-size: 1.8vh;
        }

        #cen-card:fullscreen .rb-chart-box, #cen-card:-webkit-full-screen .rb-chart-box { 
            flex-grow: 1; height: auto !important; min-height: 0; width: 100%; margin-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;
        }
        #cen-card:fullscreen .weather-grid, #cen-card:fullscreen .threshold-info, #cen-card:fullscreen .status-bar, 
        #cen-card:-webkit-full-screen .weather-grid, #cen-card:-webkit-full-screen .threshold-info, #cen-card:-webkit-full-screen .status-bar { display: none !important; }

        @media (max-width: 380px) {
            body { padding: 7px; }
            .card { padding: 11px; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>⚡ Ceny RB + Pogoda (Zielona Góra)</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Ceny Rynku Bilansującego oraz parametry pogody ZG na sieć | Klawisz F11 = Pełny Ekran</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="text-align: right;">
                <div id="date-box" class="date-box">--.--.----</div>
                <div id="clock" class="clock-box">--:--:--</div>
            </div>
            <button id="sound-toggle-btn" class="secondary" onclick="toggleSound()">🔊 Dźwięk: WŁ</button>
            <button onclick="refreshDashboard()">Odśwież dane</button>
        </div>
    </header>

    <div class="grid">
        <!-- CEN -->
        <div class="card" id="cen-card" style="border: 2px solid var(--border-color);">
            <h2>
                <span>Ceny na Rynku Bilansującym (RB)</span>
                <button class="secondary" onclick="toggleCenFullscreen()" style="padding: 6px 12px; font-size: 0.8rem;">📺 Powiększ ten panel</button>
            </h2>
            <div><span id="cen-period" class="period">Okres: --</span></div>
            <div id="cen-price" class="value-huge">--</div>
            <div class="sub-info" id="cen-sub">CEN [zł/MWh]</div>

            <!-- Dyskretny pasek pogodowy widoczny TYLKO w trybie pełnoekranowym -->
            <div id="fs-weather-strip">
                <div>🌡️ Temp: <strong id="fs-wx-temp" style="color: var(--accent-blue);">--</strong></div>
                <div>📉 Trend +3h: <strong id="fs-wx-trend"
